name: Build and Publish Yak (Test)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag-like version (e.g. v0.1.0 or v0.1.0-beta.1)"
        required: true
        default: "v0.1.0-beta.1"

permissions:
  contents: read

env:
  YAK_SOURCE_URL: https://test.yak.rhino3d.com
  YAK_CLI_URL: https://files.mcneel.com/yak/tools/0.13.0/linux-x64/yak
  YAK_PACKAGE_NAME: object-modifiers

jobs:
  build-package-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Resolve tag, version, prerelease
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag format: $RAW_TAG"
            echo "Expected: v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<pre>"
            exit 1
          fi

          VERSION="${RAW_TAG#v}"
          IS_PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore RhinoModifiers.csproj

      - name: Build release (net7)
        run: >-
          dotnet build RhinoModifiers.csproj
          -c Release
          -f net7.0
          -p:Version=${{ steps.version.outputs.version }}
          -clp:NoSummary

      - name: Download Yak CLI (Linux)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$YAK_CLI_URL" -o yak
          chmod +x yak
          ./yak --help >/dev/null

      - name: Stage package contents
        shell: bash
        run: |
          set -euo pipefail

          STAGE_DIR="$RUNNER_TEMP/yak-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          cp bin/Release/net7.0/RhinoModifiers.rhp "$STAGE_DIR/"
          cp bin/Release/net7.0/RhinoModifiers.deps.json "$STAGE_DIR/"
          cp bin/Release/net7.0/RhinoModifiers.runtimeconfig.json "$STAGE_DIR/"

          if [[ -d Definitions ]]; then
            cp -R Definitions "$STAGE_DIR/Definitions"
          fi

          if [[ -f README.md ]]; then
            cp README.md "$STAGE_DIR/README.md"
          fi

          # Use repository `wrench.png` as package icon if present.
          if [[ -f wrench.png ]]; then
            cp wrench.png "$STAGE_DIR/icon.png"
            ICON_LINE="icon: icon.png"
          else
            ICON_LINE=""
          fi

          cat > "$STAGE_DIR/manifest.yml" <<EOF
          name: $YAK_PACKAGE_NAME
          title: "Object Modifiers"
          version: ${{ steps.version.outputs.version }}
          authors:
            - Dan Kenerson
            - Moritz Rietschel
            - Chuck Driesler
            - Joshua Foxley
          description: Adds Blender-like modifiers to Rhino
          url: https://github.com/${{ github.repository }}
          keywords:
            - rhino
            - grasshopper
            - modifiers
          $ICON_LINE
          EOF

          echo "STAGE_DIR=$STAGE_DIR" >> "$GITHUB_ENV"

      - name: Build .yak package
        id: build_yak
        shell: bash
        run: |
          set -euo pipefail
          pushd "$STAGE_DIR" >/dev/null
          "$GITHUB_WORKSPACE/yak" build --platform any
          PACKAGE_FILE=$(ls -1 *.yak | head -n 1)
          echo "package_file=$STAGE_DIR/$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          popd >/dev/null

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: yak-package-${{ steps.version.outputs.raw_tag }}
          path: ${{ steps.build_yak.outputs.package_file }}

      - name: Push package to Yak test server
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${YAK_TOKEN:-}" ]]; then
            echo "Missing required secret: YAK_TOKEN"
            exit 1
          fi
          ./yak push --source "$YAK_SOURCE_URL" "${{ steps.build_yak.outputs.package_file }}"

      - name: Verify package on Yak test server
        shell: bash
        run: |
          set -euo pipefail

          echo "Search with prerelease included:"
          ./yak search --source "$YAK_SOURCE_URL" --all --prerelease "$YAK_PACKAGE_NAME" || true

          if [[ "${{ steps.version.outputs.is_prerelease }}" == "true" ]]; then
            echo "Tag is prerelease. Default search may omit this version:"
            ./yak search --source "$YAK_SOURCE_URL" --all "$YAK_PACKAGE_NAME" || true
          fi